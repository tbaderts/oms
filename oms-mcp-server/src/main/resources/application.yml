spring:
  application:
    name: oms-mcp-server
  main:
    # Keep reactive/web server disabled when acting purely as MCP over stdio.
    web-application-type: none
    banner-mode: off
  # Ollama provides local embeddings for the semantic half of hybrid search.
  # Pull the model first: `ollama pull mxbai-embed-large`
  ai:
    ollama:
      base-url: http://localhost:11434
      embedding:
        options:
          model: mxbai-embed-large   # 1024-dim, strong retrieval quality
          # Alternatives (adjust knowledge.index.embeddings prefixes to match!):
          # - nomic-embed-text:      query-prefix "search_query: ", document-prefix "search_document: "
          # - bge-m3:                no prefixes
          # - snowflake-arctic-embed2: query-prefix "query: ", no document prefix

# OMS backend for the searchOrders tool
oms:
  base-url: http://localhost:8090

server:
  port: 8091

mcp:
  transport: stdio

# Knowledge base locations (comma-separated, relative to working directory or absolute)
domain:
  docs:
    paths: ${DOMAIN_DOCS_PATHS:../oms-knowledge-base}

# Embedded Lucene knowledge index (BM25 + vector hybrid search with RRF fusion)
knowledge:
  index:
    cache-dir: .kb-index          # persistent embedding cache (content-hash keyed)
    min-section-chars: 200        # merge smaller sections with a neighbor
    max-section-chars: 6000       # split larger sections at paragraph boundaries
    embeddings:
      enabled: true               # false = BM25-only (no Ollama needed)
      # mxbai-embed-large was trained with this query instruction; documents take none.
      query-prefix: "Represent this sentence for searching relevant passages: "
      document-prefix: ""
      batch-size: 16

logging:
  level:
    org.springframework.ai.mcp: DEBUG
    org.example.mcp.index: INFO
