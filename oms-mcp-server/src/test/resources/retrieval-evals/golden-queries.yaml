# Golden query set for retrieval evaluation (recall@5, MRR).
#
# Each query lists the knowledge base documents that a good retriever should
# surface in its top results. A query counts as "recalled" if ANY expected
# document appears in the top 5 hits (document-level, anchors not required).
#
# Keep queries phrased the way a coding agent would ask, not as exact title
# matches — vocabulary mismatch is what we are measuring.

queries:
  - query: "order state transitions and lifecycle"
    expected:
      - oms-knowledge-base/oms-concepts/order-lifecycle.md
      - oms-knowledge-base/oms-framework/state-machine-framework_spec.md

  - query: "how do I cancel an order"
    expected:
      - oms-knowledge-base/oms-concepts/order-replace.md
      - oms-knowledge-base/oms-concepts/order-lifecycle.md

  - query: "replace an order that is partially filled"
