plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.example.oms'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url = uri("https://packages.confluent.io/maven/") }
}

dependencies {
    // Spring WebFlux for reactive web
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-webclient'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.11'
    implementation 'io.swagger.core.v3:swagger-annotations:2.2.53'
    
    // RSocket for bidirectional streaming
    implementation 'org.springframework.boot:spring-boot-starter-rsocket'
    
    // Kafka for event consumption
    implementation 'io.projectreactor.kafka:reactor-kafka:1.3.25'
    
    // Shared contracts: OpenAPI and Avro models, generated once in oms-contracts
    implementation 'org.example.oms:oms-contracts'

    // Confluent Avro serialization
    implementation 'io.confluent:kafka-avro-serializer:7.9.9'
    
    // JSON processing
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    
    // Actuator for health and metrics
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    
    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    // Logging
    implementation 'org.slf4j:slf4j-api'
    
    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// This module used to run three code-generation tasks and keep its own copies of the OpenAPI specs
// and Avro schemas. It consumed only the generated models — the reactive API interfaces it produced
// were never implemented — so all of it is now supplied by oms-contracts.

test {
    useJUnitPlatform()
}
