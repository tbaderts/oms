spring:
  application:
    name: oms-streaming-service
  config:
    import: optional:file:.env[.properties]

  # RSocket over WebSocket configuration
  rsocket:
    server:
      port: 7000
      transport: websocket
      mapping-path: /trade-blotter/stream

  # Kafka consumer configuration with Avro + Schema Registry
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      group-id: ${CONSUMER_GROUP:streaming-service-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
      specific.avro.reader: true

# Streaming service configuration
streaming:
  kafka:
    topics:
      orders: ${ORDER_TOPIC:oms_orders}
      # Fills with their order (SPEC-0019); oms_executions is no longer read here.
      order-executions: ${ORDER_EXECUTION_TOPIC:oms_order_executions}
    enabled: ${KAFKA_ENABLED:true}
  
  # OMS Core Query API configuration for initial snapshot
  oms:
    base-url: ${OMS_CORE_URL:http://localhost:8090}
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
  
  # Buffer settings for backpressure and cache management
  buffer:
    max-size: ${CACHE_MAX_SIZE:10000}
    replay-size: ${REPLAY_BUFFER_SIZE:100}
    timeout-seconds: 30

  # Per-subscriber bound (SPEC-0057): live events held for a client that has not requested them.
  # Past it the client's stream ends with an error; the UI's Retry reloads with a snapshot.
  subscriber:
    max-pending: ${SUBSCRIBER_MAX_PENDING:10000}

  # CORS configuration for Trade Blotter UI
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

# Server configuration
server:
  port: ${SERVER_PORT:8092}

# Actuator endpoints
management:
  endpoint:
    health:
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  # Traces, metrics and logs go to the OTLP endpoint (the Alloy agent) only when
  # OTLP_EXPORT_ENABLED=true; without it nothing is exported (SPEC-0033).
  opentelemetry:
    resource-attributes:
      "[service.name]": oms-streaming-service
      "[service.namespace]": oms
      "[deployment.environment]": ${DEPLOYMENT_ENVIRONMENT:local}
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/logs
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      otlp:
        enabled: ${OTLP_EXPORT_ENABLED:false}
  logging:
    export:
      otlp:
        enabled: ${OTLP_EXPORT_ENABLED:false}
  otlp:
    metrics:
      export:
        enabled: ${OTLP_EXPORT_ENABLED:false}
        url: ${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 15s

# Logging
logging:
  level:
    org.example.streaming: INFO
    org.springframework.messaging.rsocket: INFO
    org.apache.kafka: WARN
