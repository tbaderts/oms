spring:
  application:
    name: oms-ui
  
server:
  port: 8080
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

# OMS UI Configuration
oms:
  ui:
    app-name: OMS Admin Tool
    features:
      quotes-enabled: ${OMS_UI_QUOTES_ENABLED:false}
      quote-requests-enabled: ${OMS_UI_QUOTE_REQUESTS_ENABLED:false}
      streaming-enabled: ${OMS_UI_STREAMING_ENABLED:true}
    # Order entry (SPEC-0072): the FIX session the orders of this oms-ui are sent under; with the
    # generated clOrdId it identifies each order to oms-core.
    order-entry:
      session-id: ${OMS_UI_SESSION_ID:OMS-UI}
    # Instrument lookup and quotes for order entry (SPEC-0072). Without ALPHAVANTAGE_API_KEY only the
    # built-in instruments are offered. The key stays on this server. Answers are cached to stay within
    # the free quota (about 25 requests a day).
    market-data:
      alpha-vantage:
        api-key: ${ALPHAVANTAGE_API_KEY:}
        base-url: ${ALPHAVANTAGE_BASE_URL:https://www.alphavantage.co}
      search-ttl: PT24H
      quote-ttl: PT5M
      # The exchange simulator's instruments and reference prices (oms-exchange-simulator application.yml)
      built-in:
        - { symbol: AAPL, name: Apple Inc., currency: USD, price: 170.00 }
        - { symbol: MSFT, name: Microsoft Corporation, currency: USD, price: 420.00 }
        - { symbol: IBM, name: International Business Machines Corp., currency: USD, price: 250.00 }
        - { symbol: NVDA, name: NVIDIA Corporation, currency: USD, price: 120.00 }
        - { symbol: INTC, name: Intel Corporation, currency: USD, price: 86.96 }
  api:
    base-url: ${OMS_API_BASE_URL:http://localhost:8090}
  streaming:
    url: ${OMS_STREAMING_URL:ws://localhost:7000/trade-blotter/stream}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.example.omsui: INFO
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
