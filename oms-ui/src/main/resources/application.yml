spring:
  application:
    name: oms-ui
  
server:
  port: 8080
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

# OMS UI Configuration
oms:
  ui:
    app-name: OMS Admin Tool
    features:
      quotes-enabled: ${OMS_UI_QUOTES_ENABLED:false}
      quote-requests-enabled: ${OMS_UI_QUOTE_REQUESTS_ENABLED:false}
      streaming-enabled: ${OMS_UI_STREAMING_ENABLED:true}
  api:
    base-url: ${OMS_API_BASE_URL:http://localhost:8090}
  streaming:
    url: ${OMS_STREAMING_URL:ws://localhost:7000/trade-blotter/stream}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.example.omsui: INFO
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
