plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.github.node-gradle.node' version '7.1.0'
    id 'org.openapi.generator' version '7.24.0'
}

group = 'org.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Shared contracts: the market data API's models (SPEC-0072), generated in oms-contracts.
    implementation 'org.example.oms:oms-contracts'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Enforces the generated interface's parameter constraints (400 instead of reaching the code).
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

// ---------------------------------------------------------------------------
// API interface generation (SPEC-0072): models come from oms-contracts; only the interface this
// module implements, MarketDataApi, is generated here, as oms-core does for its APIs.
// ---------------------------------------------------------------------------

def contractsSpecDir = findProperty('omsContractsSpecDir') ?: "$projectDir/../oms-contracts/src/main/openapi"

tasks.register('openApiGenerateMarketData', org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
    generatorName = "spring"
    inputSpec = "$contractsSpecDir/oms-marketdata-api.yml".toString()
    outputDir = layout.buildDirectory.dir("generated").get().asFile.toString()
    apiPackage = "org.example.common.api"
    modelPackage = "org.example.common.model.marketdata"
    globalProperties = [apis: ""]
    configOptions = [
        interfaceOnly: "true",
        useSpringBoot3: "true",
        skipDefaultInterface: "true",
        // one interface per tag (MarketDataApi), not per first path segment ("/api")
        useTags: "true",
        enumPropertyNaming: "original",
        modelNameSuffix: ""
    ]
}

tasks.named('compileJava') {
    dependsOn 'openApiGenerateMarketData'
}

sourceSets.main.java.srcDirs += layout.buildDirectory.dir("generated/src/main/java")

// Node.js configuration for building React app
node {
    version = '22.20.0'
    npmVersion = '10.9.3'
    download = true
    workDir = file("${project.buildDir}/nodejs")
    npmWorkDir = file("${project.buildDir}/npm")
    nodeProjectDir = file("${project.projectDir}/frontend")
}

tasks.named('npmInstall') {
    // Plain `npm install`: npm 7+ must resolve and install peer dependencies
    // (e.g. ajv@8 for the hoisted ajv-keywords@5). --legacy-peer-deps skips
    // that, leaving ajv-keywords to resolve to the hoisted ajv@6 and crashing
    // the webpack build with "Cannot find module 'ajv/dist/compile/codegen'".
}

// Task to build React app (uses plugin's built-in npmInstall)
task buildReact(type: com.github.gradle.node.npm.task.NpmTask, dependsOn: npmInstall) {
    description = 'Builds the React application'
    workingDir = file("${project.projectDir}/frontend")
    args = ['run', 'build']
}

// Task to copy React build output to Spring Boot static resources
task copyReactBuild(type: Copy, dependsOn: buildReact) {
    description = 'Copies the React build output to Spring Boot static resources'
    from "${project.projectDir}/frontend/build"
    into "${project.buildDir}/resources/main/static"
}

// Task to clean React build
task cleanReact(type: Delete) {
    description = 'Cleans the React build directory'
    delete "${project.projectDir}/frontend/build"
    delete "${project.projectDir}/frontend/node_modules"
}

// Make processResources depend on copyReactBuild
processResources.dependsOn copyReactBuild

// Make clean also clean React build
clean.dependsOn cleanReact
