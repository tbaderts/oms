spring:
  application:
    name: oms
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 8
      maximum-pool-size: 32
  threads:
    virtual:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  kafka:
    properties:
      auto.register.schemas: true
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      properties:
        specific.avro.reader: true
        spring.deserializer:
          key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
          value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        schema.registry:
          url: ${REGISTRY_URL:http://localhost:8081}
      group-id: orders-group
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      auto-offset-reset: earliest
    producer:
      acks: all
      # Safe to retry aggressively because idempotence is on: the broker deduplicates retried
      # records rather than appending them twice.
      retries: 10
      properties:
        retry.backoff.ms: 250
        # Declared explicitly rather than left to client defaults. Both are required for the
        # producer's exactly-once-per-partition and ordering guarantees, and leaving them implicit
        # meant lowering `acks` for throughput would silently disable both.
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        schema.registry:
          url: ${REGISTRY_URL:http://localhost:8081}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer

kafka:
  enabled: ${KAFKA_ENABLED:false}
  order-topic: ${ORDER_TOPIC:oms_orders}
  execution-topic: ${EXECUTION_TOPIC:oms_executions}
  command-topic: ${COMMAND_TOPIC:commands}
  send-timeout-seconds: ${KAFKA_SEND_TIMEOUT_SECONDS:10}
  consumer:
    # Failed commands retry with backoff, then land on <topic>.DLT rather than being dropped.
    retry-attempts: ${KAFKA_RETRY_ATTEMPTS:4}
    retry-initial-interval-ms: ${KAFKA_RETRY_INITIAL_INTERVAL_MS:500}
  outbox:
    # The relay is what makes the outbox a delivery guarantee. Poll interval is the added latency
    # between a command committing and its event reaching Kafka.
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:200}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}

management:
  endpoint:
    health:
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  tracing:
    sampling:
      probability: 0.1

springdoc:
  show-actuator: false
  swagger-ui:
    use-root-path: true

tracing:
  enabled: ${TRACING_ENABLED:false}
  url: ${TRACING_URL:http://localhost:4317}

logging:
  level:
    org.hibernate.SQL: INFO
    org.springframework.transaction: INFO

server:
  port: ${SERVER_PORT:8090}