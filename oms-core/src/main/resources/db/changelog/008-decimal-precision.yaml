        - modifyDataType: { tableName: executions, columnName: avg_px, newDataType: NUMERIC }
        - modifyDataType: { tableName: executions, columnName: cum_qty, newDataType: NUMERIC }
        - modifyDataType: { tableName: executions, columnName: last_px, newDataType: NUMERIC }
        - modifyDataType: { tableName: executions, columnName: last_qty, newDataType: NUMERIC }
        - modifyDataType: { tableName: executions, columnName: leaves_qty, newDataType: NUMERIC }
        - modifyDataType: { tableName: executions, columnName: day_order_qty, newDataType: NUMERIC }
        - modifyDataType: { tableName: executions, columnName: day_cum_qty, newDataType: NUMERIC }
        - modifyDataType: { tableName: executions, columnName: day_avg_px, newDataType: NUMERIC }
        - modifyDataType: { tableName: order_execution_view, columnName: price, newDataType: NUMERIC }
        - modifyDataType: { tableName: order_execution_view, columnName: order_qty, newDataType: NUMERIC }
        - modifyDataType: { tableName: order_execution_view, columnName: last_qty, newDataType: NUMERIC }
        - modifyDataType: { tableName: order_execution_view, columnName: last_px, newDataType: NUMERIC }
        - modifyDataType: { tableName: order_execution_view, columnName: cum_qty, newDataType: NUMERIC }
        - modifyDataType: { tableName: order_execution_view, columnName: leaves_qty, newDataType: NUMERIC }
        - modifyDataType: { tableName: order_execution_view, columnName: avg_px, newDataType: NUMERIC }
