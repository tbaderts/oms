plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.openapi.generator' version '7.24.0'
	id 'com.github.davidmc24.gradle.plugin.avro' version '1.9.1'
}

group = 'org.example.oms'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	gradlePluginPortal()
	maven {url = uri("https://packages.confluent.io/maven/")}
}

ext {
	set('springCloudVersion', "2025.0.3")
	set('testcontainersVersion', "1.21.4")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-liquibase'
	implementation 'org.liquibase:liquibase-core'
	implementation 'org.springframework.boot:spring-boot-starter-kafka'
	implementation'io.confluent:kafka-avro-serializer:7.9.9'
	implementation 'io.micrometer:micrometer-tracing-bridge-otel'
	implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
	implementation('io.github.jaspeen:ulid-java:0.2.0') {
		exclude group: 'org.hibernate', module: 'hibernate-core'
	}
	implementation 'org.openapitools:jackson-databind-nullable:0.2.11'
    implementation 'io.swagger.core.v3:swagger-annotations:2.2.53'
	implementation 'org.mapstruct:mapstruct:1.6.3'
	implementation 'org.apache.commons:commons-lang3:3.20.0'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.kafka:spring-kafka-test'
	testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
	testImplementation "org.testcontainers:kafka:${testcontainersVersion}"
	testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

def runningOnWindows = System.getProperty('os.name').toLowerCase().contains('windows')

def sanitizeWindowsPath = { String pathValue ->
	if (pathValue == null || !runningOnWindows) {
		return pathValue
	}

	StringBuilder sanitized = new StringBuilder(pathValue.length() + 8)
	for (int index = 0; index < pathValue.length(); index++) {
		boolean looksLikeDrivePrefix = index > 0
				&& Character.isLetter(pathValue.charAt(index))
				&& index + 2 < pathValue.length()
				&& pathValue.charAt(index + 1) == ':'
				&& (pathValue.charAt(index + 2) == '\\' || pathValue.charAt(index + 2) == '/')
				&& pathValue.charAt(index - 1) != ';'

		if (looksLikeDrivePrefix) {
			sanitized.append(';')
		}

		sanitized.append(pathValue.charAt(index))
	}

	return sanitized.toString()
}

configurations {
    avroTools {
        transitive = false
    }
}

task openApiGenerateCmd(type: org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
    generatorName = "spring"
    inputSpec = "$projectDir/src/main/openapi/oms-cmd-api.yml".toString()
    outputDir = "$buildDir/generated".toString()
    apiPackage = "org.example.common.api"
    modelPackage = "org.example.common.model.cmd"
    configOptions = [
        interfaceOnly: "true",
        useSpringBoot3: "true",
        skipDefaultInterface: "true",
		enumPropertyNaming: "original",
        modelNameSuffix: "",
		additionalModelTypeAnnotations: "@lombok.experimental.SuperBuilder @lombok.extern.jackson.Jacksonized"
    ]
}

task openApiGenerateQuery(type: org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
    generatorName = "spring"
    inputSpec = "$projectDir/src/main/openapi/oms-query-api.yml".toString()
    outputDir = "$buildDir/generated".toString()
    apiPackage = "org.example.common.api"
    modelPackage = "org.example.common.model.query"
    configOptions = [
        interfaceOnly: "true",
        useSpringBoot3: "true",
        skipDefaultInterface: "true",
		enumPropertyNaming: "original",
        modelNameSuffix: "",
		additionalModelTypeAnnotations: "@lombok.experimental.SuperBuilder @lombok.extern.jackson.Jacksonized"
    ]
}

task openApiGenerateAvro(type: org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
    generatorName = "avro-schema"
    inputSpec = "$projectDir/src/main/openapi/oms-cmd-api.yml".toString()
    outputDir = "$buildDir/generated-avro".toString()
    configOptions = [
        packageName: "org.example.common.model.msg"
    ]
}

tasks.named("compileJava") {
    dependsOn tasks.named("openApiGenerateCmd")
    dependsOn tasks.named("openApiGenerateQuery")
    dependsOn tasks.named("openApiGenerateAvro")
}

// Add the generated sources to the source set
sourceSets.main.java.srcDirs += "$buildDir/generated/src/main/java"

tasks.named('test') {
	useJUnitPlatform()

	if (runningOnWindows) {
		String sanitizedPath = sanitizeWindowsPath(System.getenv('Path'))
		environment 'Path', sanitizedPath
		environment 'PATH', sanitizedPath
	}
}
