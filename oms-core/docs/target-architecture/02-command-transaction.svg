<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="One fill command as a single PostgreSQL transaction: lock the root order, deduplicate, validate, calculate, determine state, persist the execution, update the order, append the event, stage the outbox rows, run inline projections, then commit. A refusal rolls everything back and is recorded in the command log; after commit the relay is nudged." font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker>
    <symbol id="lock" viewBox="0 0 20 24">
      <rect x="2" y="10" width="16" height="12" rx="2" fill="#FDE68A" stroke="#92400E" stroke-width="1.4"/>
      <path d="M6,10 v-3 a4,4 0 0 1 8,0 v3" fill="none" stroke="#92400E" stroke-width="1.6"/>
    </symbol>
  </defs>

  <rect width="1200" height="720" fill="#FBFBFD"/>
  <text x="40" y="40" font-size="20" font-weight="700" fill="#0F172A">Anatomy of one command: a fill, inside one transaction</text>
  <text x="40" y="62" font-size="13" fill="#475569">Every step either completes or the whole command leaves no trace except its command-log row.</text>

  <!-- Transaction box -->
  <rect x="40" y="82" width="460" height="590" rx="14" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.8" stroke-dasharray="8 5"/>
  <text x="60" y="100" font-size="12" font-weight="700" fill="#134E4A">ONE POSTGRESQL TRANSACTION · fill pipeline</text>

  <g font-size="12" fill="#0F172A">
    <!-- 1 -->
    <rect x="60" y="110" width="420" height="42" rx="8" fill="#FFF7ED" stroke="#FDBA74"/>
    <circle cx="80" cy="131" r="10" fill="#0F766E"/><text x="80" y="135" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text>
    <text x="98" y="127" font-weight="700">Lock the root order</text>
    <text x="98" y="143" fill="#475569" font-size="11.5">SELECT … FOR UPDATE: every writer of this order tree waits here</text>
    <use href="#lock" x="452" y="119" width="20" height="24"/>
    <!-- 2 -->
    <rect x="60" y="162" width="420" height="42" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <circle cx="80" cy="183" r="10" fill="#0F766E"/><text x="80" y="187" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text>
    <text x="98" y="179" font-weight="700">Deduplicate</text>
    <text x="98" y="195" fill="#475569" font-size="11.5">commandId not yet applied · (orderId, execId) not yet seen</text>
    <!-- 3 -->
    <rect x="60" y="214" width="420" height="42" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <circle cx="80" cy="235" r="10" fill="#0F766E"/><text x="80" y="239" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text>
    <text x="98" y="231" font-weight="700">Validate</text>
    <text x="98" y="247" fill="#475569" font-size="11.5">fields · order LIVE · expectedVersion matches · transition allowed</text>
    <!-- 4 -->
    <rect x="60" y="266" width="420" height="42" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <circle cx="80" cy="287" r="10" fill="#0F766E"/><text x="80" y="291" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">4</text>
    <text x="98" y="283" font-weight="700">Calculate</text>
    <text x="98" y="299" fill="#475569" font-size="11.5">cumQty, leavesQty, avgPx over APPLIED fills · cumQty ≤ orderQty</text>
    <!-- 5 -->
    <rect x="60" y="318" width="420" height="42" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <circle cx="80" cy="339" r="10" fill="#0F766E"/><text x="80" y="343" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">5</text>
    <text x="98" y="335" font-weight="700">Determine state</text>
    <text x="98" y="351" fill="#475569" font-size="11.5">state machine: LIVE stays LIVE, or LIVE → FILLED when leavesQty = 0</text>
    <!-- 6 -->
    <rect x="60" y="370" width="420" height="42" rx="8" fill="#F0FDFA" stroke="#5EEAD4"/>
    <circle cx="80" cy="391" r="10" fill="#0F766E"/><text x="80" y="395" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">6</text>
    <text x="98" y="387" font-weight="700">Persist execution</text>
    <text x="98" y="403" fill="#475569" font-size="11.5">status APPLIED · order_version = n · root_order_id · fill quantities</text>
    <!-- 7 -->
    <rect x="60" y="422" width="420" height="42" rx="8" fill="#F0FDFA" stroke="#5EEAD4"/>
    <circle cx="80" cy="443" r="10" fill="#0F766E"/><text x="80" y="447" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">7</text>
    <text x="98" y="439" font-weight="700">Update order</text>
    <text x="98" y="455" fill="#475569" font-size="11.5">cumQty, leavesQty, avgPx, state · txNr = n</text>
    <!-- 8 -->
    <rect x="60" y="474" width="420" height="42" rx="8" fill="#EFF6FF" stroke="#93C5FD"/>
    <circle cx="80" cy="495" r="10" fill="#0F766E"/><text x="80" y="499" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">8</text>
    <text x="98" y="491" font-weight="700">Append event, version n</text>
    <text x="98" y="507" fill="#475569" font-size="11.5">type · exec_id · the command · changes · metadata · order snapshot</text>
    <!-- 9 -->
    <rect x="60" y="526" width="420" height="42" rx="8" fill="#FFF7ED" stroke="#FDBA74"/>
    <circle cx="80" cy="547" r="10" fill="#0F766E"/><text x="80" y="551" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">9</text>
    <text x="98" y="543" font-weight="700">Stage outbox rows</text>
    <text x="98" y="559" fill="#475569" font-size="11.5">ORDER n, EXECUTION n as pointers · PROJECTION n with its payload</text>
    <!-- 10 -->
    <rect x="60" y="578" width="420" height="42" rx="8" fill="#F0FDF4" stroke="#86EFAC"/>
    <circle cx="80" cy="599" r="10" fill="#0F766E"/><text x="80" y="603" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">10</text>
    <text x="98" y="595" font-weight="700">Inline projections</text>
    <text x="98" y="611" fill="#475569" font-size="11.5">order_execution_projection upsert</text>
    <!-- commit -->
    <rect x="60" y="630" width="420" height="30" rx="8" fill="#0F766E"/>
    <text x="270" y="650" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">COMMIT · all of the above, or none of it</text>
  </g>

  <!-- Refused box -->
  <rect x="720" y="96" width="440" height="118" rx="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6"/>
  <rect x="720" y="96" width="440" height="28" rx="12" fill="#FEE2E2"/>
  <rect x="720" y="112" width="440" height="12" fill="#FEE2E2"/>
  <text x="736" y="115" font-size="13" font-weight="700" fill="#7F1D1D">Refused at steps 2 to 5, or failed at any step</text>
  <g font-size="11.5" fill="#334155">
    <text x="736" y="146">• transaction rolled back: none of the rows on the left is written</text>
    <text x="736" y="166">• command_log row in its own transaction: REFUSED or FAILED, with the reason</text>
    <text x="736" y="186">• REST answers 400 (refusal) or 409 (conflict) · Kafka acknowledges a refusal,</text>
    <text x="736" y="204">  retries a conflict without a dead-letter budget</text>
  </g>
  <line x1="480" y1="235" x2="718" y2="160" stroke="#DC2626" stroke-width="2" marker-end="url(#ar)"/>
  <text x="596" y="188" font-size="11" fill="#991B1B">refusal, conflict</text>

  <!-- Table chips -->
  <g font-size="12" fill="#0F172A">
    <rect x="720" y="378" width="220" height="26" rx="6" fill="#F0FDFA" stroke="#5EEAD4"/><text x="732" y="395" font-family="Consolas, Menlo, monospace">executions</text>
    <rect x="720" y="430" width="220" height="26" rx="6" fill="#F0FDFA" stroke="#5EEAD4"/><text x="732" y="447" font-family="Consolas, Menlo, monospace">orders</text>
    <rect x="720" y="482" width="220" height="26" rx="6" fill="#EFF6FF" stroke="#93C5FD"/><text x="732" y="499" font-family="Consolas, Menlo, monospace">order_events</text>
    <rect x="720" y="534" width="220" height="26" rx="6" fill="#FFF7ED" stroke="#FDBA74"/><text x="732" y="551" font-family="Consolas, Menlo, monospace">outbox</text>
    <rect x="720" y="586" width="220" height="26" rx="6" fill="#F0FDF4" stroke="#86EFAC"/><text x="732" y="603" font-family="Consolas, Menlo, monospace" font-size="11">order_execution_projection</text>
  </g>
  <g font-size="11" fill="#134E4A">
    <line x1="480" y1="391" x2="718" y2="391" stroke="#0F766E" stroke-width="2" marker-end="url(#at)"/><text x="600" y="385" text-anchor="middle">INSERT, 1 row</text>
    <line x1="480" y1="443" x2="718" y2="443" stroke="#0F766E" stroke-width="2" marker-end="url(#at)"/><text x="600" y="437" text-anchor="middle">UPDATE, 1 row</text>
    <line x1="480" y1="495" x2="718" y2="495" stroke="#0F766E" stroke-width="2" marker-end="url(#at)"/><text x="600" y="489" text-anchor="middle">INSERT, 1 row, flushed now</text>
    <line x1="480" y1="547" x2="718" y2="547" stroke="#0F766E" stroke-width="2" marker-end="url(#at)"/><text x="600" y="541" text-anchor="middle">INSERT, 3 small rows</text>
    <line x1="480" y1="599" x2="718" y2="599" stroke="#0F766E" stroke-width="2" marker-end="url(#at)"/><text x="600" y="593" text-anchor="middle">UPSERT, 2 rows</text>
  </g>
  <text x="720" y="340" font-size="12" font-weight="700" fill="#0F172A">Rows written in the transaction</text>
  <text x="720" y="358" font-size="11" fill="#475569">the order snapshot is serialised once, on the event; outbox rows point at it</text>

  <!-- After commit box -->
  <rect x="720" y="628" width="440" height="74" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
  <text x="736" y="650" font-size="13" font-weight="700" fill="#134E4A">After COMMIT, on the same instance</text>
  <g font-size="11.5" fill="#334155">
    <text x="736" y="670">• metrics counted · relay nudged, the records leave within milliseconds</text>
    <text x="736" y="690">• command_log: APPLIED, event_version n · REST 201 · Kafka offset committed</text>
  </g>
  <line x1="480" y1="645" x2="718" y2="662" stroke="#0F766E" stroke-width="2" marker-end="url(#at)"/>
</svg>
