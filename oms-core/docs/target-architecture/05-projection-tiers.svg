<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Two projection tiers and the read side. Tier 1 inline projections run in the command transaction and replicate to the query instances. Tier 2 asynchronous projections are Kafka consumer groups with offsets as checkpoints. Operator facilities: rebuild, republish, reconcile, replay harness." font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
    <symbol id="db" viewBox="0 0 40 44">
      <path d="M2,8 v28 a18,6 0 0 0 36,0 v-28" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.6"/>
      <ellipse cx="20" cy="8" rx="18" ry="6" fill="#99F6E4" stroke="#0F766E" stroke-width="1.6"/>
    </symbol>
  </defs>
  <rect width="1200" height="640" fill="#FBFBFD"/>
  <text x="40" y="40" font-size="20" font-weight="700" fill="#0F172A">Read side: two projection tiers, one replica, four operator facilities</text>
  <text x="40" y="62" font-size="13" fill="#475569">Inline when a row must commit with the change; asynchronous when a consumer can be milliseconds behind.</text>

  <!-- Tier 1 -->
  <rect x="40" y="90" width="340" height="240" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8"/>
  <rect x="40" y="90" width="340" height="30" rx="12" fill="#DBEAFE"/><rect x="40" y="108" width="340" height="12" fill="#DBEAFE"/>
  <text x="56" y="110" font-size="14" font-weight="700" fill="#1E3A8A">Tier 1 · inline projections</text>
  <g font-size="11.5" fill="#334155">
    <text x="56" y="144">run by ProjectTask inside the command transaction</text>
    <rect x="56" y="156" width="300" height="24" rx="6" fill="#F0FDF4" stroke="#86EFAC"/><text x="66" y="172" font-family="Consolas, Menlo, monospace" fill="#0F172A">order_execution_projection</text>
    <rect x="56" y="188" width="300" height="24" rx="6" fill="#F0FDF4" stroke="#86EFAC"/><text x="66" y="204" font-family="Consolas, Menlo, monospace" fill="#0F172A">position_projection</text>
    <text x="56" y="236">consistent with the change by construction</text>
    <text x="56" y="254">cost: part of the fill latency, so keep the set small</text>
    <text x="56" y="272">a projection that throws fails the command</text>
    <text x="56" y="296" fill="#1E40AF">rebuild: shadow table from order_events +</text>
    <text x="56" y="312" fill="#1E40AF">executions, then swap; fills never wait</text>
  </g>

  <!-- Primary / replica / query -->
  <rect x="40" y="360" width="340" height="60" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
  <use href="#db" x="52" y="368" width="40" height="44"/>
  <text x="104" y="384" font-size="13" font-weight="700" fill="#0F172A">PostgreSQL primary</text>
  <text x="104" y="404" font-size="11.5" fill="#475569">state, events, outbox, projections</text>
  <line x1="210" y1="330" x2="210" y2="358" stroke="#0F766E" stroke-width="2" marker-end="url(#at)"/>
  <text x="220" y="348" font-size="11" fill="#134E4A">same transaction</text>

  <rect x="40" y="470" width="340" height="60" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
  <use href="#db" x="52" y="478" width="40" height="44"/>
  <text x="104" y="494" font-size="13" font-weight="700" fill="#0F172A">PostgreSQL replica</text>
  <text x="104" y="514" font-size="11.5" fill="#475569">logical replication, lag reported in health</text>
  <line x1="210" y1="420" x2="210" y2="468" stroke="#0F766E" stroke-width="2" marker-end="url(#at)"/>
  <text x="220" y="448" font-size="11" fill="#134E4A">replicates every table, projections included</text>

  <rect x="430" y="470" width="300" height="60" rx="10" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.6"/>
  <text x="446" y="494" font-size="13" font-weight="700" fill="#0F172A">oms-core · query instances</text>
  <text x="446" y="514" font-size="11.5" fill="#475569">/api/query/search · …/events?execId · …/executions</text>
  <line x1="380" y1="500" x2="428" y2="500" stroke="#16A34A" stroke-width="2" marker-end="url(#ag)"/>
  <text x="404" y="492" font-size="11" fill="#14532D" text-anchor="middle">reads</text>
  <text x="430" y="556" font-size="11.5" fill="#475569">serves the Trader UI snapshot, the MCP server, the cockpit.</text>
  <text x="430" y="574" font-size="11.5" fill="#475569">Read-your-writes: a client that got version n from a command</text>
  <text x="430" y="592" font-size="11.5" fill="#475569">waits until the query answer carries eventVersion ≥ n.</text>

  <!-- Kafka strip -->
  <rect x="430" y="150" width="300" height="180" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="1.8"/>
  <rect x="430" y="150" width="300" height="30" rx="12" fill="#FEF3C7"/><rect x="430" y="168" width="300" height="12" fill="#FEF3C7"/>
  <text x="446" y="170" font-size="14" font-weight="700" fill="#78350F">Kafka</text>
  <g font-size="12" fill="#0F172A" font-family="Consolas, Menlo, monospace">
    <rect x="446" y="194" width="268" height="26" rx="5" fill="#FFF7ED" stroke="#FDBA74"/><text x="456" y="211">oms_orders</text>
    <rect x="446" y="230" width="268" height="26" rx="5" fill="#FFF7ED" stroke="#FDBA74"/><text x="456" y="247">oms_executions</text>
    <rect x="446" y="266" width="268" height="26" rx="5" fill="#FFF7ED" stroke="#FDBA74"/><text x="456" y="283">oms_order_executions</text>
  </g>
  <text x="446" y="316" font-size="11" fill="#475569">fed by the outbox relay, in commit order per key</text>
  <line x1="380" y1="240" x2="428" y2="240" stroke="#D97706" stroke-width="2" marker-end="url(#aa)"/>
  <text x="404" y="232" font-size="11" fill="#92400E" text-anchor="middle">relay</text>

  <!-- Tier 2 -->
  <rect x="780" y="90" width="380" height="300" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.8"/>
  <rect x="780" y="90" width="380" height="30" rx="12" fill="#EDE9FE"/><rect x="780" y="108" width="380" height="12" fill="#EDE9FE"/>
  <text x="796" y="110" font-size="14" font-weight="700" fill="#4C1D95">Tier 2 · asynchronous projections</text>
  <g font-size="11.5" fill="#334155">
    <text x="796" y="144">one Kafka consumer group per projection</text>
    <rect x="796" y="156" width="348" height="40" rx="6" fill="#F5F3FF" stroke="#C4B5FD"/>
    <text x="806" y="172" font-weight="700" fill="#0F172A">Streaming service</text><text x="806" y="188" fill="#475569">blotter cache, bounded, pushed over RSocket</text>
    <rect x="796" y="204" width="348" height="40" rx="6" fill="#F5F3FF" stroke="#C4B5FD"/>
    <text x="806" y="220" font-weight="700" fill="#0F172A">Booking adapter</text><text x="806" y="236" fill="#475569">booking state per fill, reversals on busts</text>
    <rect x="796" y="252" width="348" height="40" rx="6" fill="#F5F3FF" stroke="#C4B5FD" stroke-dasharray="5 4"/>
    <text x="806" y="268" font-weight="700" fill="#475569">Analytics warehouse (planned)</text><text x="806" y="284" fill="#475569">history, TCA, regulatory reports</text>
    <text x="796" y="316">checkpoint = consumer offset · lag metric per group</text>
    <text x="796" y="334">dead-letter topic per group · idempotent on</text>
    <text x="796" y="352">(orderId, execId, orderVersion)</text>
    <text x="796" y="376" fill="#5B21B6">rebuild: re-read the topic from the start, or republish</text>
  </g>
  <line x1="730" y1="240" x2="778" y2="240" stroke="#7C3AED" stroke-width="2" marker-end="url(#av)"/>
  <text x="754" y="232" font-size="11" fill="#5B21B6" text-anchor="middle">consume</text>

  <!-- Operations -->
  <rect x="780" y="420" width="380" height="190" rx="12" fill="#FFFFFF" stroke="#64748B" stroke-width="1.6"/>
  <rect x="780" y="420" width="380" height="30" rx="12" fill="#F1F5F9"/><rect x="780" y="438" width="380" height="12" fill="#F1F5F9"/>
  <text x="796" y="440" font-size="14" font-weight="700" fill="#334155">Operator facilities</text>
  <g font-size="11.5" fill="#334155">
    <text x="796" y="472"><tspan font-weight="700">rebuild</tspan>  POST /actuator/projections/{name}/rebuild</text>
    <text x="796" y="488" fill="#475569">tier 1: shadow table from the log, swapped in milliseconds</text>
    <text x="796" y="512"><tspan font-weight="700">republish</tspan>  POST /actuator/projections/republish</text>
    <text x="796" y="528" fill="#475569">tier 2: re-stages one order's or every order's events</text>
    <text x="796" y="552"><tspan font-weight="700">reconcile</tspan>  sampler, orders vs replay, every few minutes</text>
    <text x="796" y="568" fill="#475569">gauges oms.event_log.inconsistent and oms.event_log.gaps</text>
    <text x="796" y="592"><tspan font-weight="700">replay harness</tspan>  stored commands → fresh database → diff</text>
  </g>
  <text x="40" y="624" font-size="11" fill="#475569">Rebuild refills tier 1 from the log while fills continue; republish refills tier 2 through the outbox and the topics.</text>
</svg>
