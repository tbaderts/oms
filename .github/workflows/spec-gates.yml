name: spec-gates

# Re-runs the spec workflow's policy rules on the PR diff and re-checks every gate that active
# spec tickets have already passed. See specs/README.md.
on:
  pull_request:

jobs:
  spec-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node specs/tools/spec.mjs ci --base origin/${{ github.base_ref }}
