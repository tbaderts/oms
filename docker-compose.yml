# Telemetry of the Spring services: traces, metrics and logs over OTLP to the Alloy agent, which
# forwards them to Tempo, Mimir and Loki (SPEC-0033). Sample every local request.
x-otlp-env: &otlp-env
  OTLP_EXPORT_ENABLED: "true"
  OTLP_ENDPOINT: http://alloy:4318
  TRACING_SAMPLING_PROBABILITY: "1.0"
  DEPLOYMENT_ENVIRONMENT: compose

services:

  oms-core:
    image: 'oms-core:latest'
    container_name: oms-core
    build:
      context: ./oms-core
    depends_on:
      - postgres
      - postgres-replica
      - alloy
    env_file:
      - oms-core/.env
    environment:
      <<: *otlp-env
      # Overrides for in-network container hostnames (oms-core/.env targets host-native `bootRun` execution)
      DB_URL: jdbc:postgresql://postgres:5432/postgres
      # The archive replica (SPEC-0052). REPLICA_PRIMARY_CONNINFO is how the replica's subscription
      # reaches the primary inside the compose network.
      REPLICA_ENABLED: "true"
      REPLICA_DB_URL: jdbc:postgresql://postgres-replica:5432/oms_replica
      REPLICA_DB_USER: ${REPLICA_DB_USER:-postgres}
      REPLICA_DB_PASSWORD: ${REPLICA_DB_PASSWORD:-changeme}
      REPLICA_PRIMARY_CONNINFO: host=postgres port=5432 dbname=postgres user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD:-changeme}
      KAFKA_BROKERS: broker:29092
      REGISTRY_URL: http://schema-registry:8081
      # Local runs register schemas as they go; elsewhere oms-contracts' registerSchemas does (SPEC-0025).
      KAFKA_AUTO_REGISTER_SCHEMAS: "true"
      # Browser-facing origins allowed to call oms-core directly (oms-ui SPA, CRA dev server)
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://localhost:3000
    ports:
      - "8090:8090"
    networks:
      - app-net

  streaming-service:
    image: 'oms-streaming-service:latest'
    container_name: oms-streaming-service
    build:
      context: ./oms-streaming-service
    depends_on:
      - oms-core
      - broker
      - schema-registry
      - alloy
    env_file:
      - oms-streaming-service/.env
    environment:
      <<: *otlp-env
      # Overrides for in-network container hostnames (oms-streaming-service/.env targets host-native execution)
      KAFKA_BROKERS: broker:29092
      KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
      CONSUMER_GROUP: streaming-service-group
      SERVER_PORT: 8092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      OMS_CORE_URL: http://oms-core:8090
    ports:
      - "8092:8092"   # HTTP
      - "7000:7000"   # RSocket WebSocket
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8092/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Plays the market: answers OMS orders with acks, fills, rejects and cancels (SPEC-0001).
  # Build the jar first: cd oms-exchange-simulator && ./gradlew bootJar
  exchange-simulator:
    image: 'oms-exchange-simulator:latest'
    container_name: oms-exchange-simulator
    build:
      context: ./oms-exchange-simulator
    depends_on:
      - broker
      - schema-registry
      - alloy
    environment:
      <<: *otlp-env
      KAFKA_BROKERS: broker:29092
      REGISTRY_URL: http://schema-registry:8081
      # Local runs register schemas as they go; elsewhere oms-contracts' registerSchemas does (SPEC-0025).
      KAFKA_AUTO_REGISTER_SCHEMAS: "true"
      SIMULATOR_FILL_SLICES: ${SIMULATOR_FILL_SLICES:-1}
      SIMULATOR_FILL_DELAY: ${SIMULATOR_FILL_DELAY:-0ms}
      # Reference prices from the price service, as order entry shows them (SPEC-0079); when it cannot
      # be reached the simulator uses its static prices.
      SIMULATOR_PRICE_SERVICE_URL: http://price-service:8098
    ports:
      - "8094:8094"
    networks:
      - app-net

  oms-ui:
    image: 'oms-ui:latest'
    container_name: oms-ui
    build:
      context: ./oms-ui
      # oms-ui includes oms-contracts (SPEC-0072): passed as a named context to oms-ui/Dockerfile
      additional_contexts:
        oms-contracts: ./oms-contracts
    depends_on:
      - oms-core
      - streaming-service
      - price-service
    environment:
      # Browser-facing URLs must be host-reachable (published ports), not in-network hostnames
      OMS_API_BASE_URL: http://localhost:8090
      OMS_STREAMING_URL: ws://localhost:7000/trade-blotter/stream
      # Order entry (SPEC-0072): the session its orders are sent under.
      OMS_UI_SESSION_ID: ${OMS_UI_SESSION_ID:-OMS-UI}
      # Instrument lookup and quotes are forwarded to the price service (SPEC-0079), server to server.
      PRICE_SERVICE_URL: http://price-service:8098
    ports:
      - "8080:8080"
    networks:
      - app-net

  price-service:
    image: 'oms-price-service:latest'
    container_name: oms-price-service
    build:
      context: ./oms-price-service
    depends_on:
      - alloy
    environment:
      <<: *otlp-env
      # The only holder of the market data provider's key (SPEC-0079). Without one, quotes are
      # end-of-day closes and search uses the instrument list. Set it in a root .env file, never here.
      ALPHAVANTAGE_API_KEY: ${ALPHAVANTAGE_API_KEY:-}
      ALPHAVANTAGE_BASE_URL: ${ALPHAVANTAGE_BASE_URL:-https://www.alphavantage.co}
      # The instrument list, learned closes and operator end-of-day files (put CSVs in /data/eod).
      PRICE_DATA_DIR: /data
    volumes:
      - price-data:/data
    ports:
      - "8098:8098"
    networks:
      - app-net

  broker:
    image: confluentinc/cp-kafka:7.9.9
    hostname: broker
    container_name: broker
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: '01JNXZJ4MGR5ZXBZ50A2NJSCYX'
    networks:
      - app-net

  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.9
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      - broker
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'broker:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks:
      - app-net

  control-center:
    image: confluentinc/cp-enterprise-control-center:7.9.9
    hostname: control-center
    container_name: control-center
    depends_on:
      - broker
      - schema-registry
    ports:
      - "9021:9021"
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: 'broker:29092'
      CONTROL_CENTER_CONNECT_CONNECT-DEFAULT_CLUSTER: 'connect:8083'
      CONTROL_CENTER_CONNECT_HEALTHCHECK_ENDPOINT: '/connectors'
      CONTROL_CENTER_KSQL_KSQLDB1_URL: "http://ksqldb-server:8088"
      CONTROL_CENTER_KSQL_KSQLDB1_ADVERTISED_URL: "http://localhost:8088"
      CONTROL_CENTER_SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1
      CONFLUENT_METRICS_TOPIC_REPLICATION: 1
      PORT: 9021
    networks:
      - app-net

  postgres:
    image: postgres:18.6
    container_name: postgres
    # Logical WAL feeds the archive replica (SPEC-0052). A replica that stays down keeps WAL here
    # through its slot; max_slot_wal_keep_size caps that, then invalidates the slot.
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_slot_wal_keep_size=2GB"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      PGDATA: /data/postgres
    volumes:
      - postgres:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - app-net
    restart: unless-stopped

  # The archive replica (SPEC-0052): a logical replica of the OMS database that does not replicate
  # deletes, so it keeps the full history of orders archived from the primary. It also serves CQRS
  # read separation (SPEC-0021). oms-core migrates it and creates its subscription at start-up.
  postgres-replica:
    image: postgres:18.6
    container_name: postgres-replica
    environment:
      POSTGRES_USER: ${REPLICA_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${REPLICA_DB_PASSWORD:-changeme}
      POSTGRES_DB: oms_replica
      PGDATA: /data/postgres
    volumes:
      - postgres-replica:/data/postgres
    ports:
      - "5433:5432"
    networks:
      - app-net
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9.15.0
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin4@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - app-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.0
    container_name: grafana
    ports:
      - 3000:3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-secret}
    networks:
      - app-net
    volumes:
      - grafana-storage:/var/lib/grafana
      # Provisioned datasources for the LGTM stack (SPEC-0031, SPEC-0032): mimir, loki, tempo;
      # and the OMS dashboards (SPEC-0038), read from the repository
      - ./oms-core/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./oms-core/grafana/dashboards:/etc/grafana/dashboards:ro

  # Grafana MCP server (SPEC-0038): lets an AI assistant search and read dashboards, query
  # Mimir/Loki/Tempo through Grafana and draft dashboards. Registered in .mcp.json as
  # http://localhost:8096/mcp, published on loopback only: it signs in as the stack's Grafana admin.
  grafana-mcp:
    image: grafana/mcp-grafana:2.0.2
    container_name: grafana-mcp
    depends_on:
      - grafana
    entrypoint: ["/app/mcp-grafana"]
    command: ["--transport", "streamable-http", "--address", "0.0.0.0:8000",
              "--allowed-hosts", "localhost:8096,127.0.0.1:8096"]
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_USERNAME: admin
      GRAFANA_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-secret}
    ports:
      - "127.0.0.1:8096:8000"
    networks:
      - app-net

  loki:
    image: grafana/loki:3.7.9
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - 3100:3100
    volumes:
      - ./oms-core/loki-config.yml:/etc/loki/loki-config.yaml
    networks:
      - app-net
    restart: unless-stopped

  # Telemetry agent of the LGTM stack (SPEC-0032): OTLP in on 4317/4318 (host and
  # in-network), container log tailing over the Docker socket (Promtail's successor),
  # oms-core actuator scrape. Forwards traces→Tempo, metrics→Mimir, logs→Loki.
  alloy:
    image: grafana/alloy:v1.21.3
    container_name: alloy
    command:
      - run
      - /etc/alloy/config.alloy
      # default 127.0.0.1 would hide the UI and /-/ready from the host
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    ports:
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      - "12345:12345"   # Alloy UI / readiness
    volumes:
      - ./oms-core/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
      - tempo
      - mimir
    networks:
      - app-net
    restart: unless-stopped

  # Metrics store of the LGTM stack (SPEC-0032): Mimir monolithic, filesystem storage,
  # classic ingester path (no Kafka ingest storage). Prometheus API under /prometheus.
  mimir:
    image: grafana/mimir:3.2.4
    container_name: mimir
    command: -config.file=/etc/mimir/mimir-config.yaml
    ports:
      - "9009:9009"
    volumes:
      - ./oms-core/mimir-config.yml:/etc/mimir/mimir-config.yaml:ro
    networks:
      - app-net
    restart: unless-stopped

  # Trace backend of the LGTM stack (SPEC-0031, Tempo 3 since SPEC-0032). OTLP arrives
  # in-network from alloy; host 3200 is the Tempo API only.
  tempo:
    image: grafana/tempo:3.1.1
    container_name: tempo
    command: -config.file=/etc/tempo/tempo-config.yaml
    ports:
      - "3200:3200"
    volumes:
      - ./oms-core/tempo-config.yml:/etc/tempo/tempo-config.yaml
    networks:
      - app-net
    restart: unless-stopped

networks:
  app-net:
    driver: bridge

volumes:
  postgres:
  postgres-replica:
  pgadmin:
  grafana-storage: {}
  price-data:
