spring:
  application:
    name: oms-exchange-simulator
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    # Trace context crosses Kafka in both directions (P-15).
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    consumer:
      group-id: ${SIMULATOR_GROUP_ID:exchange-simulator}
      # latest: a new consumer group must not replay the retained order history as new orders.
      auto-offset-reset: ${SIMULATOR_OFFSET_RESET:latest}
      # Values arrive as bytes and are decoded by OrderMessageDecoder (SPEC-0077), so a dead letter
      # carries exactly what arrived. These properties configure that decoder.
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      properties:
        specific.avro.reader: true
        schema.registry:
          url: ${REGISTRY_URL:http://localhost:8081}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        enable.idempotence: true
        schema.registry:
          url: ${REGISTRY_URL:http://localhost:8081}
        # One subject per command record, commands-<record full name> (SPEC-0025). Schemas are
        # registered by `registerSchemas` in oms-contracts; docker-compose and the test base set
        # KAFKA_AUTO_REGISTER_SCHEMAS=true so local runs need no registration step.
        value.subject.name.strategy: io.confluent.kafka.serializers.subject.TopicRecordNameStrategy
        auto.register.schemas: ${KAFKA_AUTO_REGISTER_SCHEMAS:false}

server:
  port: ${SERVER_PORT:8094}

# One error policy for every Kafka consumer and producer, the same in every service (SPEC-0077).
# Retryable failures back off exponentially until retry-for has passed, then go to the dead-letter
# topic <topic>.<service-name>.DLT; failures that cannot succeed on a retry (bad data, a programming
# error, a permission error) go there at once.
kafka:
  error-policy:
    service-name: oms-exchange-simulator
    retry-for: ${KAFKA_RETRY_FOR:PT2M}
    initial-interval: ${KAFKA_RETRY_INITIAL:PT0.5S}
    max-interval: ${KAFKA_RETRY_MAX:PT30S}
    multiplier: 2.0
  topics:
    replication-factor: ${KAFKA_TOPIC_REPLICATION_FACTOR:1}

simulator:
  order-topic: ${ORDER_TOPIC:oms_orders}
  command-topic: ${COMMAND_TOPIC:commands}
  fill-slices: ${SIMULATOR_FILL_SLICES:1}
  fill-delay: ${SIMULATOR_FILL_DELAY:0ms}
  last-mkt: ${SIMULATOR_LAST_MKT:XSIM}
  # Reference prices come from the price service (SPEC-0079), which owns market data: a live quote or
  # the last end-of-day close. Its answers are cached for quote-ttl; after an outage it is left alone
  # for provider-backoff. Without a URL only the static reference-prices below are used.
  quote-ttl: ${SIMULATOR_QUOTE_TTL:5m}
  provider-backoff: ${SIMULATOR_PROVIDER_BACKOFF:60s}
  price-service:
    url: ${SIMULATOR_PRICE_SERVICE_URL:}
  # A limit priced further through the reference than this is rejected, as NYSE's Limit Order Price
  # Protection does. The passive side is not collared.
  price-collar:
    tiers:
      - { max-reference: 25.00, percent: 10 }
      - { max-reference: 50.00, percent: 5 }
    default-percent: 3
  # The fallback when the price service is not configured, cannot answer or has no price for a symbol.
  reference-prices:
    AAPL: 170.00
    MSFT: 420.00
    IBM: 250.00
    NVDA: 120.00
    INTC: 86.96

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  # Traces, metrics and logs go to the OTLP endpoint (the Alloy agent) only when
  # OTLP_EXPORT_ENABLED=true; without it nothing is exported (SPEC-0033).
  opentelemetry:
    resource-attributes:
      "[service.name]": oms-exchange-simulator
      "[service.namespace]": oms
      "[deployment.environment]": ${DEPLOYMENT_ENVIRONMENT:local}
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/logs
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      otlp:
        enabled: ${OTLP_EXPORT_ENABLED:false}
  logging:
    export:
      otlp:
        enabled: ${OTLP_EXPORT_ENABLED:false}
  otlp:
    metrics:
      export:
        enabled: ${OTLP_EXPORT_ENABLED:false}
        url: ${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 15s
