openapi: 3.0.3
info:
  title: Digital Assets OMS Query API
  version: 2.7.0
  description: |
    Query (read-only) API for searching Orders with dynamic filtering, pagination, and sorting.
    
    Filtering:
      - Supports equality, substring (like), numeric/date comparisons, and inclusive ranges.
      - Date-time values must be ISO-8601 instants (e.g. `2025-08-29T12:34:56Z`).
      - Enum fields only support equality: side, ordType, state, cancelState.
      - Unknown or malformed filters are ignored.
    
    Filterable fields:
      - String: orderId, rootOrderId, parentOrderId, clOrdId, account, symbol, securityId
      - Numeric: price, orderQty, cashOrderQty
      - DateTime (Instant): sendingTime, transactTime, expireTime,
        orderReceivedTime, ackTime, marketSendTime, marketAckTime
      - Enum: side, ordType, state, cancelState
    
    Sorting:
      - Use the `sort` query parameter with multiple segments separated by `;`.
      - Each segment: `field[,ASC|DESC]` (direction defaults to ASC).
      - Example: `sort=price,DESC;orderQty,ASC`.
      - Defaults to `id,DESC` if not specified.
    
    Pagination:
      - `page` (0-based, default 0)
      - `size` (default 50, max 500)
    
    Responses return paged lists of orders with metadata.

    Execution search:
      - `/executions/search` searches stored fills (the executions table) with the same filters,
        pagination and sorting as `/search` for orders; newest stored fill first by default.
      - Filterable: String execId, orderId, rootOrderId, symbol, securityId, execType, lastMkt,
        lastCapacity; Numeric lastQty, lastPx, cumQty, leavesQty, avgPx, orderVersion;
        DateTime transactTime; Enum status, securityIdSource.
      - `/executions` is a different read model: each fill with its order, for booking and
        downstream systems.

    Event log:
      - `/orders/{orderId}/events` returns every event-log entry of one order, oldest first.

    Operations (SPEC-0075, tag Admin, read-only):
      - `/admin/outbox/*` shows the messages waiting in the outbox and their state (pending, stuck,
        held behind a stuck message).
      - `/admin/dead-letters*` lists the dead-letter topics and reads their latest records without
        consuming them.
paths:
  /search:
    get:
      operationId: searchOrders
      summary: Dynamic search for Orders
      description: |
        Search orders with dynamic filters, pagination, and sorting.
        
        All query parameters except 'page', 'size', and 'sort' are treated as dynamic filters.
        Filter parameters follow the naming conventions described in the API description above.
        
        Examples:
          - ?symbol=BTCUSD&side=BUY
          - ?price__between=100,200&state=LIVE
          - ?orderId__like=test&page=0&size=20&sort=transactTime,DESC
      tags:
        - Orders
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: 0-based page index (default 0)
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
          description: Page size (default 50, max 500)
        - name: sort
          in: query
          required: false
          schema:
            type: string
          description: Semicolon-separated list of sort instructions. Each instruction is `field[,ASC|DESC]`.
      responses:
        '200':
          description: Paged list of matching orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedOrderDto'
        '400':
          description: Bad request (invalid parameter format)
        '500':
          description: Internal server error
  /orders/{orderId}/events:
    get:
      operationId: getOrderEvents
      summary: Event log of one order
      description: |
        Every entry of the order's event log, in ascending `version` (the order in which the
        changes happened). With `execId`, only the entries about that execution: its fill and any
        bust, correction or whack of it. Returns an empty array when no events match; whether the
        order exists is answered by `searchOrders`.
      tags:
        - Orders
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
          description: Business order id (`orderId`, not the database id)
        - name: execId
          in: query
          required: false
          schema:
            type: string
          description: >-
            Only entries about this execution (the venue's execId, as on the fill). Matches
            order_events.exec_id.
      responses:
        '200':
          description: The order's event log, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderEventDto'
        '500':
          description: Internal server error

  /orders/{orderId}/commands:
    get:
      operationId: getOrderCommands
      summary: Command log of one order
      description: |
        Every command received for the order and what became of it (applied, refused or failed),
        oldest first: by `receivedAt`, then in the order they were logged. A command that failed and
        was retried appears once per attempt. Returns an empty array when nothing was logged for the
        order id.
      tags:
        - Orders
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
          description: Business order id (`orderId`, not the database id)
      responses:
        '200':
          description: The order's command log, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommandLogEntryDto'
        '500':
          description: Internal server error

  /executions:
    get:
      operationId: getExecutions
      summary: Fills with the order as of each fill
      description: |
        One entry per applied fill, from the order-execution projection, oldest first by default,
        newest first with `order=newest` (`transactTime`, or when the fill was recorded if it has
        none; then storage order). Filters
        combine with AND; the time filters apply to `transactTime` only, so fills without one never
        match them. Returns an empty array when nothing matches.
      tags:
        - Executions
      parameters:
        - name: orderId
          in: query
          required: false
          schema:
            type: string
          description: Business order id
        - name: rootOrderId
          in: query
          required: false
          schema:
            type: string
          description: Root of the order tree; an order without a root is its own root
        - name: account
          in: query
          required: false
          schema:
            type: string
        - name: transactTimeFrom
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Inclusive lower bound on the fill's transactTime
        - name: transactTimeTo
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Exclusive upper bound on the fill's transactTime
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 5000
            default: 1000
          description: Maximum number of fills returned
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [oldest, newest]
            default: oldest
          description: >-
            Sort direction: `oldest` (default) or `newest` first, by transactTime (the projection
            time for fills without one), then storage order. With `newest`, `limit` keeps the most
            recent fills (SPEC-0067).
      responses:
        '200':
          description: Matching fills, oldest first by default, newest first with `order=newest`
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExecutionViewDto'
        '400':
          description: Invalid parameter
        '500':
          description: Internal server error

  /executions/search:
    get:
      operationId: searchExecutions
      summary: Dynamic search for executions (stored fills)
      description: |
        Search the executions table with dynamic filters, pagination and sorting, like /search for
        orders (SPEC-0070). All query parameters except page, size and sort are filters: `field`
        (equals), `field__like`, `field__gt|gte|lt|lte`, `field__between=a,b`. Unknown filter
        fields are ignored. Newest stored fill first unless `sort` says otherwise; sorting by a
        field an execution does not have is a 400.
      tags:
        - Executions
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: 0-based page index (default 0)
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
          description: Page size (default 50, max 500)
        - name: sort
          in: query
          required: false
          schema:
            type: string
          description: Semicolon-separated `field[,ASC|DESC]`; default `id,DESC` (newest stored first)
      responses:
        '200':
          description: Paged list of matching executions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedExecutionDto'
        '400':
          description: Bad request (invalid page, size or sort field)
        '500':
          description: Internal server error

  /admin/outbox/summary:
    get:
      operationId: getOutboxSummary
      summary: Counts of outbox messages by state
      description: |
        How many messages wait in the outbox, by state (SPEC-0075, SPEC-0077). The outbox holds only
        messages still to be published: a published message is deleted. STUCK messages were
        dead-lettered (a failure that cannot succeed on a retry, or one that outlasted
        `kafka.error-policy.retry-for` or `kafka.outbox.max-attempts`), or their dead-letter topic
        refused them; they are no longer sent and hold the later messages of their aggregate. HELD
        messages wait behind a stuck message of their aggregate (same topic and key); PENDING messages
        are being sent or retried.
      tags:
        - Admin
      responses:
        '200':
          description: The outbox's counts by state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxSummaryDto'
        '500':
          description: Internal server error

  /admin/outbox/messages:
    get:
      operationId: getOutboxMessages
      summary: Outbox messages, oldest first
      description: |
        The messages waiting in the outbox, oldest (lowest id) first, optionally of one state
        (SPEC-0075). Read-only: listing changes no message and counts no attempt.
      tags:
        - Admin
      parameters:
        - name: state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OutboxState'
          description: Only messages in this state; all when absent
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Page number (0-based)
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Page size (max 200)
      responses:
        '200':
          description: A page of outbox messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedOutboxMessageDto'
        '400':
          description: Bad request (invalid state, page or size)
        '500':
          description: Internal server error

  /admin/outbox/messages/{id}:
    get:
      operationId: getOutboxMessage
      summary: One outbox message, with its payload
      description: |
        Every field of one outbox message (SPEC-0075). A message that carries its payload (projection
        messages, and messages staged before SPEC-0047) has it decoded to JSON; a pointer message
        names the order, execution and version its record will be built from.
      tags:
        - Admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: The outbox message id
      responses:
        '200':
          description: The message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxMessageDetailDto'
        '404':
          description: No such message (it may have been published meanwhile)
        '500':
          description: Internal server error

  /admin/dead-letters:
    get:
      operationId: getDeadLetterTopics
      summary: Dead-letter topics and their record counts
      description: |
        Every topic on the broker whose name ends in `.DLT`, with how many records it holds
        (SPEC-0075). oms-core's command listener routes a command it could not process to
        `<command-topic>.DLT`.
      tags:
        - Admin
      responses:
        '200':
          description: The dead-letter topics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeadLetterTopicDto'
        '503':
          description: Kafka is unreachable or disabled (problem detail)
        '500':
          description: Internal server error

  /admin/dead-letters/{topic}/records:
    get:
      operationId: getDeadLetterRecords
      summary: Latest records of one dead-letter topic
      description: |
        The latest records of one dead-letter topic, newest first, with the failure details Spring
        Kafka recorded in their headers and the value decoded where possible (SPEC-0075). Reading
        consumes nothing: no consumer group is used and no offset is committed.
      tags:
        - Admin
      parameters:
        - name: topic
          in: path
          required: true
          schema:
            type: string
            pattern: '^.+\.DLT$'
          description: A dead-letter topic (its name ends in `.DLT`)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
          description: How many of the latest records to return (max 500)
      responses:
        '200':
          description: The topic's latest records, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeadLetterRecordDto'
        '400':
          description: Bad request (not a dead-letter topic, or invalid limit)
        '404':
          description: No such topic
        '503':
          description: Kafka is unreachable or disabled (problem detail)
        '500':
          description: Internal server error

components:
  schemas:
    OutboxState:
      type: string
      description: >-
        Where an outbox message stands (SPEC-0075, SPEC-0077). PENDING: being sent or retried. STUCK:
        dead-lettered (or refused by its dead-letter topic) and no longer sent; it holds the later
        messages of its aggregate. HELD: not stuck, but waiting behind a stuck message of its
        aggregate (same topic and key).
      enum: [PENDING, STUCK, HELD]
    OutboxSummaryDto:
      type: object
      description: The outbox's messages counted by state (SPEC-0075).
      properties:
        pending:
          type: integer
          format: int64
        stuck:
          type: integer
          format: int64
          description: As the oms.outbox.stuck gauge.
        held:
          type: integer
          format: int64
        maxAttempts:
          type: integer
          description: >-
            kafka.outbox.max-attempts, the backstop after which a failing message is dead-lettered
            even within the retry window (SPEC-0077).
        oldestWaitingCreatedAt:
          type: string
          format: date-time
          description: When the oldest message still to be published (pending or held) was staged; absent when none is.
        oldestWaitingAgeSeconds:
          type: integer
          format: int64
          description: Its age in seconds, as the oms.outbox.oldest.age gauge; absent when none is waiting.
    OutboxMessageDto:
      type: object
      description: One message waiting in the outbox (SPEC-0075).
      properties:
        id:
          type: integer
          format: int64
        state:
          $ref: '#/components/schemas/OutboxState'
        aggregateType:
          type: string
          description: ORDER, EXECUTION, ORDER_EXECUTION or PROJECTION.
        topic:
          type: string
        key:
          type: string
          description: The Kafka key (the outbox's aggregate id).
        orderId:
          type: string
        execId:
          type: string
        aggregateVersion:
          type: integer
          format: int64
        payloadType:
          type: string
          description: The message type of a projection message.
        createdAt:
          type: string
          format: date-time
        attempts:
          type: integer
        maxAttempts:
          type: integer
        lastError:
          type: string
    OutboxMessageDetailDto:
      type: object
      description: One outbox message with its payload (SPEC-0075).
      properties:
        id:
          type: integer
          format: int64
        state:
          $ref: '#/components/schemas/OutboxState'
        aggregateType:
          type: string
        topic:
          type: string
        key:
          type: string
        orderId:
          type: string
        execId:
          type: string
        aggregateVersion:
          type: integer
          format: int64
        payloadType:
          type: string
        createdAt:
          type: string
          format: date-time
        attempts:
          type: integer
        maxAttempts:
          type: integer
        lastError:
          type: string
        payload:
          type: object
          description: >-
            The record the message carries, decoded to JSON; absent for a pointer message, whose
            record is built from orderId, execId and aggregateVersion at publish time.
        payloadSchemaId:
          type: integer
          description: The schema registry id its payload was written with, when recorded.
        payloadError:
          type: string
          description: Why the payload could not be decoded, when it could not.
    PagedOutboxMessageDto:
      type: object
      description: A page of outbox messages (SPEC-0075).
      properties:
        content:
          type: array
          x-field-extra-annotation: "@lombok.Builder.Default"
          items:
            $ref: '#/components/schemas/OutboxMessageDto'
        page:
          $ref: '#/components/schemas/PageMetadata'
    DeadLetterTopicDto:
      type: object
      description: A dead-letter topic (SPEC-0075).
      properties:
        topic:
          type: string
        partitions:
          type: integer
        records:
          type: integer
          format: int64
          description: Records it holds, summed over its partitions (end minus start offset).
    DeadLetterPayloadFormat:
      type: string
      description: >-
        How a dead-letter record's value was decoded. AVRO: Confluent-framed Avro, decoded with its
        registered schema into payload. TEXT: UTF-8 text, in payloadText. BINARY: anything else, as
        hex in payloadText. EMPTY: no value.
      enum: [AVRO, TEXT, BINARY, EMPTY]
    DeadLetterRecordDto:
      type: object
      description: One record of a dead-letter topic, with the failure Spring Kafka recorded (SPEC-0075).
      properties:
        topic:
          type: string
        partition:
          type: integer
        offset:
          type: integer
          format: int64
        timestamp:
          type: string
          format: date-time
          description: When the record was dead-lettered.
        key:
          type: string
        originalTopic:
          type: string
        originalPartition:
          type: integer
        originalOffset:
          type: integer
          format: int64
        originalTimestamp:
          type: string
          format: date-time
        exceptionClass:
          type: string
        exceptionMessage:
          type: string
        causeClass:
          type: string
        payloadFormat:
          $ref: '#/components/schemas/DeadLetterPayloadFormat'
        payload:
          type: object
          description: The decoded value, for AVRO.
        payloadText:
          type: string
          description: The value as text (TEXT) or hex (BINARY).
        payloadError:
          type: string
          description: Why an Avro-framed value could not be decoded, when it could not.
        headers:
          type: object
          description: Every header, binary values in hex.
          additionalProperties:
            type: string
    ExecutionViewDto:
      type: object
      description: One applied fill with the order as of that fill (the order-execution projection).
      required: [orderId, execId, orderVersion]
      properties:
        orderId:
          type: string
        execId:
          type: string
        rootOrderId:
          type: string
        parentOrderId:
          type: string
        leg:
          type: string
        clOrdId:
          type: string
        sessionId:
          type: string
        account:
          type: string
        side:
          type: string
        symbol:
          type: string
        securityId:
          type: string
        ordType:
          type: string
        price:
          type: number
          description: At most 10 integer digits and 8 decimal places
          x-field-extra-annotation: "@jakarta.validation.constraints.Digits(integer = 10, fraction = 8)"
        orderQty:
          type: number
          description: At most 10 integer digits and 8 decimal places
          x-field-extra-annotation: "@jakarta.validation.constraints.Digits(integer = 10, fraction = 8)"
        settlCurrency:
          type: string
        exDestination:
          type: string
        lastQty:
          type: number
          description: At most 10 integer digits and 8 decimal places
          x-field-extra-annotation: "@jakarta.validation.constraints.Digits(integer = 10, fraction = 8)"
        lastPx:
          type: number
          description: At most 10 integer digits and 8 decimal places
          x-field-extra-annotation: "@jakarta.validation.constraints.Digits(integer = 10, fraction = 8)"
        execType:
          type: string
        lastCapacity:
          type: string
        lastMkt:
          type: string
        transactTime:
          type: string
          format: date-time
          x-java-type: java.time.Instant
        cumQty:
          type: number
          description: At most 10 integer digits and 8 decimal places
          x-field-extra-annotation: "@jakarta.validation.constraints.Digits(integer = 10, fraction = 8)"
        leavesQty:
          type: number
          description: At most 10 integer digits and 8 decimal places
          x-field-extra-annotation: "@jakarta.validation.constraints.Digits(integer = 10, fraction = 8)"
        avgPx:
          type: number
          description: At most 10 integer digits and 8 decimal places
          x-field-extra-annotation: "@jakarta.validation.constraints.Digits(integer = 10, fraction = 8)"
        state:
          type: string
        orderVersion:
          type: integer
          format: int64
          description: The order's event-log version this fill produced
        tradeDate:
          type: string
          format: date
          description: UTC date of transactTime
    ExecutionStatus:
      type: string
      description: Whether a fill still counts (SPEC-0044)
      enum: [APPLIED, BUSTED, CORRECTED]
    ExecutionDto:
      type: object
      description: One stored fill as the venue reported it, without its order's fields (SPEC-0070).
      required: [orderId, execId]
      properties:
        id:
          type: integer
          format: int64
          description: Storage id; the most recently stored fill has the highest
        execId:
          type: string
        orderId:
          type: string
        rootOrderId:
          type: string
        symbol:
          type: string
        securityId:
          type: string
        securityIdSource:
          $ref: 'schema.yml#/components/schemas/SecurityIdSource'
        execType:
          type: string
        lastQty:
          type: number
          description: At most 10 integer digits and 8 decimal places
          x-field-extra-annotation: "@jakarta.validation.constraints.Digits(integer = 10, fraction = 8)"
        lastPx:
          type: number
          description: At most 10 integer digits and 8 decimal places
          x-field-extra-annotation: "@jakarta.validation.constraints.Digits(integer = 10, fraction = 8)"
        lastMkt:
          type: string
        lastCapacity:
          type: string
        cumQty:
          type: number
          description: At most 10 integer digits and 8 decimal places
          x-field-extra-annotation: "@jakarta.validation.constraints.Digits(integer = 10, fraction = 8)"
        leavesQty:
          type: number
          description: At most 10 integer digits and 8 decimal places
          x-field-extra-annotation: "@jakarta.validation.constraints.Digits(integer = 10, fraction = 8)"
        avgPx:
          type: number
          description: At most 10 integer digits and 8 decimal places
          x-field-extra-annotation: "@jakarta.validation.constraints.Digits(integer = 10, fraction = 8)"
        transactTime:
          type: string
          format: date-time
          x-java-type: java.time.Instant
        status:
          $ref: '#/components/schemas/ExecutionStatus'
        orderVersion:
          type: integer
          format: int64
          description: The order's event-log version the fill produced
    PagedExecutionDto:
      type: object
      description: Paged collection of ExecutionDto
      properties:
        content:
          type: array
          x-field-extra-annotation: "@lombok.Builder.Default"
          items:
            $ref: '#/components/schemas/ExecutionDto'
          description: Executions in the current page
        page:
          $ref: '#/components/schemas/PageMetadata'
    CommandSource:
      type: string
      description: Where a command entered the OMS.
      enum: [REST, KAFKA, SCHEDULER]
    CommandOutcome:
      type: string
      description: What became of a command.
      enum: [APPLIED, REFUSED, FAILED]
    CommandLogEntryDto:
      type: object
      description: One command the OMS received and its outcome.
      required: [type, receivedAt, source, outcome]
      properties:
        commandId:
          type: string
          description: The command's commandId, when it had one.
        type:
          type: string
          description: The command type, e.g. OrderCancelRequestCmd.
        orderId:
          type: string
        receivedAt:
          type: string
          format: date-time
          x-java-type: java.time.Instant
          description: When the command crossed the OMS boundary.
        source:
          $ref: '#/components/schemas/CommandSource'
        principal:
          type: string
          description: >-
            Who sent it: the Kafka producer or the scheduler. Absent on REST until authentication
            exists.
        outcome:
          $ref: '#/components/schemas/CommandOutcome'
        reason:
          type: string
          description: Why it was refused or failed.
        eventVersion:
          type: integer
          format: int64
          description: The version of the event it appended, when it was applied.
    OrderEventType:
      type: string
      description: The kind of change an event-log entry records.
      enum: [NEW_ORDER, ACK, PARTIAL_FILL, FILL, CXL, REJ, CXL_REQUEST, CXL_REJ, EXP, CLOSE,
             EXEC_BUST, EXEC_CORRECT, EXEC_WHACK]
    OrderEventDto:
      type: object
      description: One entry of an order's event log.
      required: [orderId, version, event]
      properties:
        orderId:
          type: string
        version:
