openapi: 3.0.3
info:
  title: Digital Assets OMS Query API
  version: 2.5.0
  description: |
    Query (read-only) API for searching Orders with dynamic filtering, pagination, and sorting.
    
    Filtering:
      - Supports equality, substring (like), numeric/date comparisons, and inclusive ranges.
      - Date-time values must be ISO-8601 instants (e.g. `2025-08-29T12:34:56Z`).
      - Enum fields only support equality: side, ordType, state, cancelState.
      - Unknown or malformed filters are ignored.
    
    Filterable fields:
      - String: orderId, rootOrderId, parentOrderId, clOrdId, account, symbol, securityId
      - Numeric: price, orderQty, cashOrderQty
      - DateTime (Instant): sendingTime, transactTime, expireTime,
        orderReceivedTime, ackTime, marketSendTime, marketAckTime
      - Enum: side, ordType, state, cancelState
    
    Sorting:
      - Use the `sort` query parameter with multiple segments separated by `;`.
      - Each segment: `field[,ASC|DESC]` (direction defaults to ASC).
      - Example: `sort=price,DESC;orderQty,ASC`.
      - Defaults to `id,DESC` if not specified.
    
    Pagination:
      - `page` (0-based, default 0)
      - `size` (default 50, max 500)
    
    Responses return paged lists of orders with metadata.

    Event log:
      - `/orders/{orderId}/events` returns every event-log entry of one order, oldest first.
paths:
  /search:
    get:
      operationId: searchOrders
      summary: Dynamic search for Orders
      description: |
        Search orders with dynamic filters, pagination, and sorting.
        
        All query parameters except 'page', 'size', and 'sort' are treated as dynamic filters.
        Filter parameters follow the naming conventions described in the API description above.
        
        Examples:
          - ?symbol=BTCUSD&side=BUY
          - ?price__between=100,200&state=LIVE
          - ?orderId__like=test&page=0&size=20&sort=transactTime,DESC
      tags:
        - Orders
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: 0-based page index (default 0)
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
          description: Page size (default 50, max 500)
        - name: sort
          in: query
          required: false
          schema:
            type: string
          description: Semicolon-separated list of sort instructions. Each instruction is `field[,ASC|DESC]`.
      responses:
        '200':
          description: Paged list of matching orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedOrderDto'
        '400':
          description: Bad request (invalid parameter format)
        '500':
          description: Internal server error
  /orders/{orderId}/events:
    get:
      operationId: getOrderEvents
      summary: Event log of one order
      description: |
        Every entry of the order's event log, in ascending `version` (the order in which the
        changes happened). With `execId`, only the entries about that execution: its fill and any
        bust, correction or whack of it. Returns an empty array when no events match; whether the
        order exists is answered by `searchOrders`.
      tags:
        - Orders
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
          description: Business order id (`orderId`, not the database id)
        - name: execId
          in: query
          required: false
          schema:
            type: string
          description: >-
            Only entries about this execution (the venue's execId, as on the fill). Matches
            order_events.exec_id.
      responses:
        '200':
          description: The order's event log, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderEventDto'
        '500':
          description: Internal server error

  /orders/{orderId}/commands:
    get:
      operationId: getOrderCommands
      summary: Command log of one order
      description: |
        Every command received for the order and what became of it (applied, refused or failed),
        oldest first: by `receivedAt`, then in the order they were logged. A command that failed and
        was retried appears once per attempt. Returns an empty array when nothing was logged for the
        order id.
      tags:
        - Orders
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
          description: Business order id (`orderId`, not the database id)
      responses:
        '200':
          description: The order's command log, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommandLogEntryDto'
        '500':
          description: Internal server error

  /executions:
    get:
      operationId: getExecutions
      summary: Fills with the order as of each fill
      description: |
        One entry per applied fill, from the order-execution projection, oldest first
        (`transactTime`, or when the fill was recorded if it has none; then storage order). Filters
        combine with AND; the time filters apply to `transactTime` only, so fills without one never
        match them. Returns an empty array when nothing matches.
      tags:
        - Executions
      parameters:
        - name: orderId
          in: query
          required: false
          schema:
            type: string
          description: Business order id
        - name: rootOrderId
          in: query
          required: false
          schema:
            type: string
          description: Root of the order tree; an order without a root is its own root
        - name: account
          in: query
          required: false
          schema:
            type: string
        - name: transactTimeFrom
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Inclusive lower bound on the fill's transactTime
        - name: transactTimeTo
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Exclusive upper bound on the fill's transactTime
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 5000
            default: 1000
          description: Maximum number of fills returned
      responses:
        '200':
          description: Matching fills, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExecutionViewDto'
        '400':
          description: Invalid parameter
        '500':
          description: Internal server error

components:
  schemas:
    ExecutionViewDto:
      type: object
      description: One applied fill with the order as of that fill (the order-execution projection).
      required: [orderId, execId, orderVersion]
      properties:
        orderId:
          type: string
        execId:
          type: string
        rootOrderId:
          type: string
        parentOrderId:
          type: string
        leg:
          type: string
        clOrdId:
          type: string
        sessionId:
          type: string
        account:
          type: string
        side:
          type: string
        symbol:
          type: string
        securityId:
          type: string
        ordType:
          type: string
        price:
          type: number
          description: At most 10 integer digits and 8 decimal places
          x-field-extra-annotation: "@jakarta.validation.constraints.Digits(integer = 10, fraction = 8)"
        orderQty:
          type: number
          description: At most 10 integer digits and 8 decimal places
          x-field-extra-annotation: "@jakarta.validation.constraints.Digits(integer = 10, fraction = 8)"
        settlCurrency:
          type: string
        exDestination:
          type: string
        lastQty:
          type: number
          description: At most 10 integer digits and 8 decimal places
          x-field-extra-annotation: "@jakarta.validation.constraints.Digits(integer = 10, fraction = 8)"
        lastPx:
          type: number
          description: At most 10 integer digits and 8 decimal places
          x-field-extra-annotation: "@jakarta.validation.constraints.Digits(integer = 10, fraction = 8)"
        execType:
          type: string
        lastCapacity:
          type: string
        lastMkt:
          type: string
        transactTime:
          type: string
          format: date-time
          x-java-type: java.time.Instant
        cumQty:
          type: number
          description: At most 10 integer digits and 8 decimal places
          x-field-extra-annotation: "@jakarta.validation.constraints.Digits(integer = 10, fraction = 8)"
        leavesQty:
          type: number
          description: At most 10 integer digits and 8 decimal places
          x-field-extra-annotation: "@jakarta.validation.constraints.Digits(integer = 10, fraction = 8)"
        avgPx:
          type: number
          description: At most 10 integer digits and 8 decimal places
          x-field-extra-annotation: "@jakarta.validation.constraints.Digits(integer = 10, fraction = 8)"
        state:
          type: string
        orderVersion:
          type: integer
          format: int64
          description: The order's event-log version this fill produced
        tradeDate:
          type: string
          format: date
          description: UTC date of transactTime
    CommandSource:
      type: string
      description: Where a command entered the OMS.
      enum: [REST, KAFKA, SCHEDULER]
    CommandOutcome:
      type: string
      description: What became of a command.
      enum: [APPLIED, REFUSED, FAILED]
    CommandLogEntryDto:
      type: object
      description: One command the OMS received and its outcome.
      required: [type, receivedAt, source, outcome]
      properties:
        commandId:
          type: string
          description: The command's commandId, when it had one.
        type:
          type: string
          description: The command type, e.g. OrderCancelRequestCmd.
        orderId:
          type: string
        receivedAt:
          type: string
          format: date-time
          x-java-type: java.time.Instant
          description: When the command crossed the OMS boundary.
        source:
          $ref: '#/components/schemas/CommandSource'
        principal:
          type: string
          description: >-
            Who sent it: the Kafka producer or the scheduler. Absent on REST until authentication
            exists.
        outcome:
          $ref: '#/components/schemas/CommandOutcome'
        reason:
          type: string
          description: Why it was refused or failed.
        eventVersion:
          type: integer
          format: int64
          description: The version of the event it appended, when it was applied.
    OrderEventType:
      type: string
      description: The kind of change an event-log entry records.
      enum: [NEW_ORDER, ACK, PARTIAL_FILL, FILL, CXL, REJ, CXL_REQUEST, CXL_REJ, EXP, CLOSE,
             EXEC_BUST, EXEC_CORRECT, EXEC_WHACK]
    OrderEventDto:
      type: object
      description: One entry of an order's event log.
      required: [orderId, version, event]
      properties:
        orderId:
          type: string
        version:
          type: integer
          format: int64
          description: Monotonic per-order sequence, starting at 1.
        event:
          $ref: '#/components/schemas/OrderEventType'
        commandId:
          type: string
          description: The causing command's commandId, when it had one.
        resultingState:
          $ref: 'schema.yml#/components/schemas/State'
        timeStamp:
          type: string
          format: date-time
          x-java-type: java.time.Instant
          description: When the event was recorded, on the OMS clock.
        transaction:
          type: object
          description: >-
            The command that caused the change, as accepted by the command API (a `Command` from
            oms-cmd-api.yml; its `type` property names the command type).
        orderSnapshot:
          $ref: '#/components/schemas/OrderDto'
        correlationId:
          type: string
          description: >-
            The causing command's correlationId (Kafka header or REST body), when it had one.
            SPEC-0049.
        causationId:
          type: string
          description: The causing command's causationId, when it had one. SPEC-0049.
        principal:
          type: string
          description: >-
            Who sent the causing command: the Kafka producer or the scheduler job
            (oms-core:expiry, oms-core:end-of-day); null on REST until authentication exists.
            SPEC-0049.
        source:
          type: string
          enum: [REST, KAFKA, SCHEDULER]
          description: Where the causing command entered the OMS. SPEC-0049.
        changes:
          type: object
          description: >-
            The fields this event changed, as {"<field>": {"from": <old>, "to": <new>}}, with
            field names and values as in orderSnapshot. A first event lists every field set at
            creation with from null. Null for events recorded before SPEC-0049.
    OrderDto:
      type: object
      description: Summary Order representation used in query responses.
      properties:
        id:
          type: integer
          format: int64
        orderId:
          type: string
        parentOrderId:
          type: string
        rootOrderId:
          type: string
        tx:
          type: string
          description: Command type (Cmd enum)
        txNr:
          type: integer
          format: int64
        eventVersion:
          type: integer
          format: int64
          description: >-
            The order's latest event-log version: the highest order_events.version for the order,
            and the eventId of its newest oms_orders message. Absent when the order has no events.
            Read-your-writes: a client that needs to see its own change waits until search returns
            the order with eventVersion at least the CommandResult.eventVersion its command got
            (SPEC-0050).
        sessionId:
          type: string
        clOrdId:
          type: string
        sendingTime:
          type: string
          format: date-time
          x-java-type: java.time.Instant
        account:
          type: string
        origClOrdId:
          type: string
        execInst:
          type: string
          description: ExecInst enum
        handlInst:
          type: string
          description: HandlInst enum
        securityIdSource:
          type: string
          description: SecurityIdSource enum
        leg:
          type: string
          description: Leg enum
        orderQty:
          type: number
          description: BigDecimal represented as number. At most 10 integer digits and 8 decimal places
          x-field-extra-annotation: "@jakarta.validation.constraints.Digits(integer = 10, fraction = 8)"
        cashOrderQty:
          type: number
          description: BigDecimal represented as number. At most 10 integer digits and 8 decimal places
          x-field-extra-annotation: "@jakarta.validation.constraints.Digits(integer = 10, fraction = 8)"
        placeQty:
          type: number
          description: How much of the order quantity is placed in the market. At most 10 integer digits and 8 decimal places
          x-field-extra-annotation: "@jakarta.validation.constraints.Digits(integer = 10, fraction = 8)"
        cumQty:
          type: number
          description: Currently executed quantity for chain of orders. At most 10 integer digits and 8 decimal places
          x-field-extra-annotation: "@jakarta.validation.constraints.Digits(integer = 10, fraction = 8)"
        leavesQty:
          type: number
          description: Quantity open for further execution. At most 10 integer digits and 8 decimal places
          x-field-extra-annotation: "@jakarta.validation.constraints.Digits(integer = 10, fraction = 8)"
        allocQty:
          type: number
          description: Quantity allocated to client. At most 10 integer digits and 8 decimal places
          x-field-extra-annotation: "@jakarta.validation.constraints.Digits(integer = 10, fraction = 8)"
        positionEffect:
          type: string
          description: PositionEffect enum
        securityDesc:
          type: string
        securityType:
          type: string
          description: SecurityType enum
        maturityMonthYear:
          type: string
        strikePrice:
          type: number
          description: BigDecimal represented as number. At most 10 integer digits and 8 decimal places
          x-field-extra-annotation: "@jakarta.validation.constraints.Digits(integer = 10, fraction = 8)"
        priceType:
          type: string
          description: PriceType enum
        putOrCall:
          type: integer
        underlyingSecurityType:
          type: string
        ordType:
          $ref: 'schema.yml#/components/schemas/OrdType'
        price:
          type: number
          description: BigDecimal represented as number. At most 10 integer digits and 8 decimal places
          x-field-extra-annotation: "@jakarta.validation.constraints.Digits(integer = 10, fraction = 8)"
        stopPx:
          type: number
          description: BigDecimal represented as number. At most 10 integer digits and 8 decimal places
          x-field-extra-annotation: "@jakarta.validation.constraints.Digits(integer = 10, fraction = 8)"
        securityId:
          type: string
        side:
          $ref: 'schema.yml#/components/schemas/Side'
        symbol:
          type: string
        timeInForce:
          $ref: 'schema.yml#/components/schemas/TimeInForce'
        transactTime:
          type: string
          format: date-time
          x-java-type: java.time.Instant
        exDestination:
          type: string
        settlCurrency:
          type: string
        expireTime:
          type: string
          format: date-time
          x-java-type: java.time.Instant
        securityExchange:
          type: string
        text:
          type: string
        rejectReason:
          type: string
          maxLength: 255
          description: Latest reason the venue gave for refusing the order or a cancel request (FIX Text 58 from the venue). The client's own text stays in `text`.
        tifTimestamp:
          type: string
          format: date-time
          x-java-type: java.time.Instant
        orderReceivedTime:
          type: string
          format: date-time
          x-java-type: java.time.Instant
          description: |
            SLA checkpoint — the moment this order crossed the OMS boundary, on the OMS clock.
            Equivalent to FIX TrdRegTimestampType 2 (TimeIn). Written once and never updated.
        ackTime:
          type: string
          format: date-time
          x-java-type: java.time.Instant
          description: |
            SLA checkpoint — the moment the OMS completed validation and assumed responsibility
            for a client order, which is when the client acknowledgement goes out. Set on the
            CLI leg only. `ackTime - orderReceivedTime` is time-to-ack.
        marketSendTime:
          type: string
          format: date-time
          x-java-type: java.time.Instant
          description: |
            SLA checkpoint — the moment the order was released downstream to the broker or venue.
            Equivalent to FIX TrdRegTimestampType 3 (TimeOut). Set on the MKT leg only.
        marketAckTime:
          type: string
          format: date-time
          x-java-type: java.time.Instant
          description: |
            SLA checkpoint — the moment the downstream acknowledgement was observed at the OMS
            boundary. Equivalent to FIX TrdRegTimestampType 4 (BrokerReceipt). Set on the MKT
            leg only. This is when the broker or venue confirmed receipt, not when the order
            reached the order book; we cannot observe the latter.
        state:
          $ref: 'schema.yml#/components/schemas/State'
        cancelState:
          $ref: 'schema.yml#/components/schemas/CancelState'
    PagedOrderDto:
      type: object
      description: Paged collection of OrderDto
      properties:
        content:
          type: array
          x-field-extra-annotation: "@lombok.Builder.Default"
          items:
            $ref: '#/components/schemas/OrderDto'
          description: List of orders in the current page
        page:
          $ref: '#/components/schemas/PageMetadata'
    PageMetadata:
      type: object
      properties:
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer
        number:
          type: integer
