openapi: 3.0.3
info:
  title: OMS Market Data API
  version: 1.1.0
  description: |
    Instrument lookup and quotes (SPEC-0072, SPEC-0079). Served by oms-price-service, which owns
    market data and the provider's API key; oms-ui's backend serves the same paths for order entry
    and forwards them to it, and the exchange simulator reads its reference prices from it.

    Instrument search answers from the price service's instrument list (refreshed daily) and never
    spends the provider's quota. A quote is a live provider answer (Alpha Vantage) while the price
    service's request budget lasts, cached for minutes; otherwise the last known close from its
    end-of-day store, with a `notice` saying why. Provider limits and failures never fail a
    request. Only oms-ui answers 503, when it cannot reach the price service.
paths:
  /api/market-data/instruments:
    get:
      operationId: searchInstruments
      summary: Instruments whose symbol or name matches a query
      tags:
        - MarketData
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 40
          description: Part of a symbol or an instrument name
      responses:
        '200':
          description: Matching instruments, possibly none
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentSearchResult'
        '400':
          description: Missing or invalid query
        '503':
          description: oms-ui only. The price service cannot be reached (Problem+JSON, type urn:oms:error:price-service-unavailable)
  /api/market-data/quotes/{symbol}:
    get:
      operationId: getQuote
      summary: The latest quote for a symbol
      tags:
        - MarketData
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 20
      responses:
        '200':
          description: The latest quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '404':
          description: Neither a live quote nor the end-of-day store has a price for this symbol
        '503':
          description: oms-ui only. The price service cannot be reached (Problem+JSON, type urn:oms:error:price-service-unavailable)

components:
  schemas:
    MarketDataSource:
      type: string
      description: >
        Where the data came from. ALPHA_VANTAGE: a live provider answer. END_OF_DAY: the last known
        close from the price service's end-of-day store (asOf is its date). REFERENCE_DATA: the
        price service's instrument list. BUILT_IN: no longer produced (SPEC-0079); kept so older
        answers still parse.
      enum:
        - ALPHA_VANTAGE
        - BUILT_IN
        - END_OF_DAY
        - REFERENCE_DATA
    Instrument:
      type: object
      required:
        - symbol
      properties:
        symbol:
          type: string
        name:
          type: string
        type:
          type: string
          description: Instrument type as the provider names it (e.g. Equity, ETF)
        region:
          type: string
        currency:
          type: string
    InstrumentSearchResult:
      type: object
      required:
        - instruments
        - source
      properties:
        instruments:
          type: array
          x-field-extra-annotation: "@lombok.Builder.Default"
          items:
            $ref: '#/components/schemas/Instrument'
        source:
          $ref: '#/components/schemas/MarketDataSource'
        notice:
          type: string
          description: Anything the caller should know about where the results came from
    Quote:
      type: object
      required:
        - symbol
        - source
      properties:
        symbol:
          type: string
        last:
          type: number
          description: Last traded price; for an END_OF_DAY quote, the close of the asOf trading day
        change:
          type: number
        changePercent:
          type: number
          description: Change in percent, e.g. 1.25 for +1.25%
        high:
          type: number
        low:
          type: number
        previousClose:
          type: number
        bid:
          type: number
          description: Absent when the provider does not supply it
        ask:
          type: number
          description: Absent when the provider does not supply it
        currency:
          type: string
        asOf:
          type: string
          description: The trading day (yyyy-MM-dd) the price belongs to, or the provider's as-of time
        source:
          $ref: '#/components/schemas/MarketDataSource'
        notice:
          type: string
          description: Why no live price was used, when it was not (e.g. the request limit is reached)
