plugins {
    id 'base'
}

def includedBuildNames = [
    'oms-contracts',
    'oms-core',
    'oms-streaming-service',
    'oms-mcp-server',
    'oms-ui'
]

// oms-contracts is a plain library, so it has no bootJar task.
def bootJarBuildNames = includedBuildNames - 'oms-contracts'

def includedTaskRefs = { taskPath, buildNames = includedBuildNames ->
    buildNames.collect { buildName ->
        gradle.includedBuild(buildName).task(taskPath)
    }
}

tasks.register('cleanAll') {
    group = 'build'
    description = 'Runs clean in all included builds.'
    dependsOn includedTaskRefs(':clean')
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Runs build in all included builds.'
    dependsOn includedTaskRefs(':build')
}

tasks.register('testAll') {
    group = 'verification'
    description = 'Runs test in all included builds.'
    dependsOn includedTaskRefs(':test')
}

tasks.register('bootJarAll') {
    group = 'build'
    description = 'Runs bootJar in all included builds that produce one.'
    dependsOn includedTaskRefs(':bootJar', bootJarBuildNames)
}

tasks.named('clean') {
    dependsOn tasks.named('cleanAll')
}

tasks.named('build') {
    dependsOn tasks.named('buildAll')
}
